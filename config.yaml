# Gateway routing table.
# Each route sends requests whose path starts with path_prefix to upstream.
# The longest matching prefix wins.

upstream_timeout_seconds: 5.0

routes:
  # Dummy upstream for local development:
  #   uvicorn dummy_upstream.main:app --port 8001
  - path_prefix: /api
    upstream: http://localhost:8001

  # Your C++ HTTP server. Uncomment and set the port it listens on.
  # - path_prefix: /cpp
  #   upstream: http://localhost:8080

# API keys. Remove this whole section to turn auth off.
# Make a real key with:  python -m app.security <client-name> --routes /api
auth:
  keys:
    # LOCAL DEVELOPMENT ONLY. The key is "gw_dev_local_only" and it is
    # public (it's in the README). Delete this entry before deploying.
    - client: local-dev
      key_sha256: 1968b31589e9aad4699d926451a0cfc1a08d73878937987a8e2e3563a04f8193
      routes: [/api]

# Rate limiting: a token bucket per client (per IP when auth is off).
# capacity = biggest burst, refill_per_second = long-run average rate.
# Remove this whole section to turn rate limiting off.
rate_limit:
  backend: memory               # one process; use redis for several
  default:
    capacity: 20
    refill_per_second: 10
  # Shared buckets for several gateway processes or replicas:
  # backend: redis
  # redis_url: redis://localhost:6379/0
  # fail_open: true             # Redis down: allow (true) or 429 (false)

# Retries: failed upstream calls are tried again, after a random backoff.
# Only when safe: connect failures for any method; 502/503/504 and broken
# connections only for GET, HEAD, OPTIONS, PUT, DELETE. Timeouts never.
# Remove this section for one attempt per request.
retries:
  max_attempts: 3               # total, including the first try
  base_delay_seconds: 0.05      # backoff: random in [0, base * 2^n], capped
  max_delay_seconds: 1.0
  budget_ratio: 0.2             # retries <= 20% of recent requests per upstream
  budget_min_per_second: 1.0    # ...plus this floor, for quiet upstreams

# Circuit breaker, one per upstream: after failure_threshold failures in a
# row, fail fast with 503 for recovery_timeout_seconds, then let one probe
# request through. Remove this section to turn breakers off.
circuit_breaker:
  failure_threshold: 5
  recovery_timeout_seconds: 10
