# Prometheus for the docker-compose stack.
# UI: http://localhost:9090 (Status -> Targets shows whether scraping works).

global:
  scrape_interval: 5s       # short, so the dashboard moves while you watch
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  # The gateway's metrics port. Not published to the host: only Prometheus,
  # inside the compose network, can reach it.
  - job_name: gateway
    static_configs:
      - targets: ["gateway:9100"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
